<rect x="274" y="140" width="184" height="90" rx="12" fill="#E0F2FE"/>
<text x="366.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Capture</text>
<text x="366.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">structured record</text>
<line x1="462" y1="185" x2="504" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="508" y="140" width="184" height="90" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Qualify</text>
<text x="600.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">score 0-100, route it</text>
<line x1="696" y1="185" x2="738" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="742" y="140" width="184" height="90" rx="12" fill="#E0F2FE"/>
<text x="834.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Book</text>
<text x="834.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">real calendar slot</text>
<line x1="930" y1="185" x2="972" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="976" y="140" width="184" height="90" rx="12" fill="#0B1F4A"/>
<text x="1068.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Follow up</text>
<text x="1068.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">until answered</text>
<text x="40" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">HOT leads (80+) go straight to a human with a full summary. The evaluation suite from Lesson 35 grades every step.</text>
