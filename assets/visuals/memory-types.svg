<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">Three kinds of memory</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Confusing these is the most common beginner design mistake.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="135" width="300" height="68" rx="12" fill="#E0F2FE"/>
<text x="190.0" y="176.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">CONTEXT WINDOW</text>
<text x="370" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">This conversation, right now</text>
<text x="370" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Gone when the session ends</text>
<rect x="40" y="223" width="300" height="68" rx="12" fill="#E0F2FE"/>
<text x="190.0" y="264.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">SHORT-TERM STORE</text>
<text x="370" y="253" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Notes within one task or day</text>
<text x="370" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Summaries, scratchpads, files</text>
<rect x="40" y="311" width="300" height="68" rx="12" fill="#0B1F4A"/>
<text x="190.0" y="352.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">LONG-TERM MEMORY</text>
<text x="370" y="341" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Facts kept across sessions</text>
<text x="370" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Vector store or database, retrieved on need</text>
<text x="40" y="415" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Lessons 15 to 17 build each kind, then Lesson 17 teaches context engineering: choosing what earns a place.</text>
</svg>