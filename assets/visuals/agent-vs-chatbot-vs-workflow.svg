<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">Agent, chatbot, or workflow?</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Same tools, three different shapes. Pick by how much judgement the job needs.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="140" width="340" height="80" rx="12" fill="#E0F2FE"/>
<text x="210.0" y="187.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">CHATBOT</text>
<text x="60" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Answers questions</text>
<text x="60" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- No tools, no actions</text>
<text x="60" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Fixed knowledge</text>
<rect x="420" y="140" width="340" height="80" rx="12" fill="#E0F2FE"/>
<text x="590.0" y="187.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">WORKFLOW</text>
<text x="440" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Fixed steps, every time</text>
<text x="440" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Tools run in a set order</text>
<text x="440" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Breaks on surprises</text>
<rect x="800" y="140" width="340" height="80" rx="12" fill="#0B1F4A"/>
<text x="970.0" y="187.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">AGENT</text>
<text x="820" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Pursues a goal</text>
<text x="820" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Chooses tools and order</text>
<text x="820" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">- Adapts within guardrails</text>
<text x="40" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Lesson 01 teaches you to tell them apart before you build the wrong one.</text>
</svg>