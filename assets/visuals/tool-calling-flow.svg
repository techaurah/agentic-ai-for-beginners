<rect x="508" y="140" width="184" height="90" rx="12" fill="#E0F2FE"/>
<text x="600.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Your code</text>
<text x="600.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">validates and runs it</text>
<line x1="696" y1="185" x2="738" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
